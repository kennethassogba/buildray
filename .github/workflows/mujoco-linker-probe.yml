name: MuJoCo linker dependency diagnosis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: google-deepmind/mujoco
          ref: 651bae11c3c38efe483f033b4b7e869e7ce3f4ec
          path: fixtures/mujoco
          persist-credentials: false
      - name: Install the corpus toolchain
        run: bash action/install.sh
      - name: Diagnose actual library builds
        run: python tests/corpus/mujoco_linker_idle.py fixtures/mujoco "$RUNNER_TEMP/mujoco-linker-probe"
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mujoco-linker-probe
          path: ${{ runner.temp }}/mujoco-linker-probe/evidence/
