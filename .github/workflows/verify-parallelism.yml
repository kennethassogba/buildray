name: Verify saved XGrammar parallelism

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify jobs ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 1-2
            levels: '[1,2]'
          - label: 4-8
            levels: '[4,8]'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore successful measured reports
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          LEVELS: ${{ matrix.levels }}
          LABEL: ${{ matrix.label }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[0-9]+", os.environ["SOURCE_RUN"])'
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "parallelism-xgrammar-$LABEL" --dir "$RUNNER_TEMP/measurements"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'measurements'
          report = json.loads((root / 'report.json').read_text())
          assert report['status'] == 'passed' and report['patch_validated']
          assert report['candidate_consistency_verified'] and report['command'] == 'unity'
          assert report['job_levels'] == json.loads(os.environ['LEVELS'])
          assert all(r['status'] == 'passed' for r in report['levels'])
          run = json.loads(subprocess.check_output(['gh', 'api',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SOURCE_RUN']}"]))
          provenance = {k: run[k] for k in ['id', 'head_sha', 'html_url']}
          (root / 'measurement-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
      - name: Install the matching build tools
        run: bash action/install.sh
      - uses: actions/checkout@v6
        with:
          repository: kennethassogba/xgrammar
          ref: f95f769b2eca1ca10a2820ff6566eca20efddc23
          path: fixtures/xgrammar-pr995
          persist-credentials: false
      - name: Independently build and test the real option
        env:
          LEVELS: ${{ matrix.levels }}
        run: |
          git -C fixtures/xgrammar-pr995 submodule update --init --depth 1 3rdparty/dlpack 3rdparty/googletest
          printf '%s\n' 'set(XGRAMMAR_BUILD_PYTHON_BINDINGS OFF)' 'set(XGRAMMAR_BUILD_CXX_TESTS ON)' > fixtures/xgrammar-pr995/config.cmake
          cmake -S fixtures/xgrammar-pr995 -B "$RUNNER_TEMP/upstream-unity" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-21 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_UNITY_BUILD=OFF \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DXGRAMMAR_ENABLE_UNITY_BUILD=ON
          cmake --build "$RUNNER_TEMP/upstream-unity" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/upstream-unity" --output-on-failure \
            --no-tests=error --output-junit "$RUNNER_TEMP/measurements/upstream-pr995-tests.xml"
          python tests/corpus/verify_upstream_unity.py \
            --source fixtures/xgrammar-pr995 --build "$RUNNER_TEMP/upstream-unity" \
            --artifacts "$RUNNER_TEMP/measurements" --levels "$LEVELS"
      - name: Retain measurements and independent proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verified-parallelism-xgrammar-${{ matrix.label }}
          path: ${{ runner.temp }}/measurements
          if-no-files-found: error
