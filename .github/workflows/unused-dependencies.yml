name: Validate upstream patches
on:
  workflow_call:
    inputs:
      incremental_only:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      incremental_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  highway:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: kennethassogba/highway
          ref: abfced9c16b295e68ae2e88dc3f278426790f654
          path: fixtures/highway
          persist-credentials: false
      - name: Install tools
        run: |
          bash action/install.sh
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/highway-llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22
      - name: Build and test the 35 changed programs
        run: python3 tests/corpus/review_patches.py highway
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: highway-upstream-validation
          path: review-results/
  sentencepiece:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: kennethassogba/sentencepiece
          ref: 920eec39156f8a0774bd7960034888ac7402e1a2
          path: fixtures/sentencepiece
          persist-credentials: false
      - name: Install tools
        run: bash action/install.sh
      - name: Validate PCH off and on; measure source and header edits
        run: python3 tests/corpus/review_patches.py sentencepiece
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sentencepiece-upstream-validation
          path: review-results/
