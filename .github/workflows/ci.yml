name: C++26 CLI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ai_corpus:
        description: Profile headers and benchmark a PCH on pinned SentencePiece (several clean builds).
        type: boolean
        default: false
      profile_headers:
        description: Capture header traces before the SentencePiece PCH experiment.
        type: boolean
        default: true
      pch_target:
        description: SentencePiece target for the PCH experiment.
        type: string
        default: sentencepiece-static
      pch_headers:
        description: JSON array of PCH headers for the SentencePiece experiment.
        type: string
        default: '["<string>", "<vector>", "<memory>", "<algorithm>", "<unordered_map>"]'
      pch_auto:
        description: Automatically profile and select a PCH header; pch-target optionally restricts the target.
        type: boolean
        default: false
      dependency_corpus:
        description: Build, test and capture dependency graphs on pinned MuJoCo and XGrammar.
        type: boolean
        default: false
      header_runs:
        description: Header clean-build pairs. One validates a patch without a performance recommendation.
        type: choice
        options: ['1', '3', '5']
        default: '3'
      header_corpus:
        description: Validate and benchmark header cleanup and forward declarations on the existing AI corpus.
        type: boolean
        default: false
      link_corpus:
        description: Validate and benchmark one redundant CMake link on pinned XGrammar.
        type: boolean
        default: false
      unity_corpus:
        description: Validate and measure target-scoped unity builds on SentencePiece, XGrammar and MuJoCo.
        type: boolean
        default: false
      unity_runs:
        description: Unity clean-build pairs. One validates without a performance recommendation.
        type: choice
        options: ['1', '3', '5']
        default: '3'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            sanitizers: "OFF"
          - build_type: Debug
            sanitizers: "ON"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CMake and LLVM 21
        run: bash action/install.sh
      - name: Configure C++26
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-21
          -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILDRAY_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Composite action bootstrap and comparison
        if: matrix.build_type == 'Release'
        id: action
        uses: ./
        with:
          source: tests/fixtures/action
          baseline-ref: ${{ github.sha }}
          install-dependencies: 'false'
          max-regression-percent: '1000'
          artifact-name: action-smoke
      - name: Check action outputs
        if: matrix.build_type == 'Release'
        env:
          COMPARISON: ${{ steps.action.outputs.comparison }}
          BASELINE: ${{ steps.action.outputs.baseline-sha }}
          EXPECTED: ${{ github.sha }}
        run: |
          test -f "$COMPARISON"
          test "$BASELINE" = "$EXPECTED"
      - name: Real C++ project
        if: matrix.build_type == 'Release'
        run: |
          git clone https://github.com/leethomason/tinyxml2.git "$RUNNER_TEMP/tinyxml2"
          git -C "$RUNNER_TEMP/tinyxml2" checkout 9148bdf719e997d1f474be6bcc7943881046dba1
          build/buildray optimize --source "$RUNNER_TEMP/tinyxml2" --work-dir "$RUNNER_TEMP/tinyxml2-result" --compiler clang++-21 --clang-tidy clang-tidy-21 --runs 3 --jobs 2 -- -Dtinyxml2_BUILD_TESTING=ON
          git -C "$RUNNER_TEMP/tinyxml2" apply --check "$RUNNER_TEMP/tinyxml2-result/includes.patch"
          python tests/check_real_project.py "$RUNNER_TEMP/tinyxml2-result/report.json"
      - name: Profile headers and validate a PCH on tinyxml2
        if: matrix.build_type == 'Release'
        run: |
          build/buildray profile --source "$RUNNER_TEMP/tinyxml2" --work-dir "$RUNNER_TEMP/tinyxml2-headers" --compiler clang++-21 -- -Dtinyxml2_BUILD_TESTING=ON
          build/buildray pch --source "$RUNNER_TEMP/tinyxml2" --work-dir "$RUNNER_TEMP/tinyxml2-pch" --target xmltest --header '<string>' --header '<vector>' --compiler clang++-21 --runs 3 --jobs 2 -- -Dtinyxml2_BUILD_TESTING=ON
          git -C "$RUNNER_TEMP/tinyxml2" apply --check "$RUNNER_TEMP/tinyxml2-pch/pch.patch"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.build_type }}
          include-hidden-files: true
          path: |
            build/Testing/Temporary/
            ${{ runner.temp }}/tinyxml2-result/report.json
            ${{ runner.temp }}/tinyxml2-result/includes.patch
            ${{ runner.temp }}/tinyxml2-result/logs/
            ${{ runner.temp }}/tinyxml2-headers/headers.json
            ${{ runner.temp }}/tinyxml2-headers/headers.md
            ${{ runner.temp }}/tinyxml2-headers/report.json
            ${{ runner.temp }}/tinyxml2-pch/report.json
            ${{ runner.temp }}/tinyxml2-pch/pch.patch
            ${{ runner.temp }}/tinyxml2-pch/logs/

  ai-corpus:
    if: github.event_name == 'workflow_dispatch' && inputs.ai_corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch SentencePiece v0.2.2
        run: |
          git clone --depth 1 --branch v0.2.2 https://github.com/google/sentencepiece.git fixtures/sentencepiece
          test "$(git -C fixtures/sentencepiece rev-parse HEAD)" = e0cce7d37b065b5140349dbe12c6bcf6192fdd78
      - name: Profile headers on the AI corpus
        if: inputs.profile_headers
        uses: ./
        with:
          source: fixtures/sentencepiece
          command: profile
          cmake-args: '["-DSPM_BUILD_TEST=ON", "-DSPM_ENABLE_SHARED=OFF", "-DSPM_ENABLE_TCMALLOC=OFF"]'
          artifact-name: sentencepiece-v0.2.2-headers
      - name: Validate and measure a PCH on the AI corpus
        uses: ./
        with:
          source: fixtures/sentencepiece
          command: pch
          pch-auto: ${{ inputs.pch_auto }}
          pch-target: ${{ inputs.pch_target }}
          pch-headers: ${{ inputs.pch_auto && '[]' || inputs.pch_headers }}
          install-dependencies: ${{ !inputs.profile_headers }}
          runs: '3'
          jobs: '2'
          cmake-args: '["-DSPM_BUILD_TEST=ON", "-DSPM_ENABLE_SHARED=OFF", "-DSPM_ENABLE_TCMALLOC=OFF"]'
          artifact-name: sentencepiece-v0.2.2-pch

  link-corpus:
    if: github.event_name == 'workflow_dispatch' && inputs.link_corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch pinned XGrammar
        run: |
          git clone https://github.com/mlc-ai/xgrammar.git fixtures/xgrammar
          git -C fixtures/xgrammar checkout 7e269d56c74c89de52bc8c31e42191155416371f
          git -C fixtures/xgrammar submodule update --init 3rdparty/dlpack 3rdparty/googletest
          printf 'set(XGRAMMAR_BUILD_PYTHON_BINDINGS OFF)\nset(XGRAMMAR_BUILD_CXX_TESTS ON)\n' > fixtures/xgrammar/config.cmake
      - name: Validate and measure a redundant CMake link
        uses: ./
        with:
          source: fixtures/xgrammar
          command: prune-links
          link-target: xgrammar_test
          link-dependency: gtest
          exclude-paths: '["3rdparty"]'
          runs: '3'
          jobs: '2'
          artifact-name: xgrammar-cmake-link

  dependency-corpus:
    name: dependency-corpus (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' && inputs.dependency_corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mujoco
            repository: google-deepmind/mujoco
            revision: f640345f72b773e7ec52cd9426a57335cf9c6c28
            cmake_args: '["-DMUJOCO_BUILD_EXAMPLES=OFF", "-DMUJOCO_BUILD_SIMULATE=OFF", "-DMUJOCO_BUILD_TESTS=ON", "-DMUJOCO_TEST_PYTHON_UTIL=OFF"]'
          - name: xgrammar
            repository: mlc-ai/xgrammar
            revision: 7e269d56c74c89de52bc8c31e42191155416371f
            cmake_args: '[]'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: fixtures/${{ matrix.name }}
          persist-credentials: false
      - name: Prepare XGrammar C++ configuration
        if: matrix.name == 'xgrammar'
        working-directory: fixtures/xgrammar
        run: |
          git submodule update --init --depth 1 3rdparty/dlpack 3rdparty/googletest
          printf '%s\n' 'set(XGRAMMAR_BUILD_PYTHON_BINDINGS OFF)' 'set(XGRAMMAR_BUILD_CXX_TESTS ON)' > config.cmake
      - name: Prepare MuJoCo test locale
        if: matrix.name == 'mujoco'
        run: sudo locale-gen de_DE.UTF-8
      - name: Capture dependencies and run CTest
        uses: ./
        with:
          command: deps
          source: fixtures/${{ matrix.name }}
          cmake-args: ${{ matrix.cmake_args }}
          jobs: '2'
          artifact-name: ${{ matrix.name }}-dependencies

  header-corpus:
    name: header-corpus (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' && inputs.header_corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: xgrammar
            repository: mlc-ai/xgrammar
            revision: 7e269d56c74c89de52bc8c31e42191155416371f
            paths: '["cpp"]'
            exclusions: '["3rdparty"]'
            cmake_args: '[]'
          - name: sentencepiece
            repository: google/sentencepiece
            revision: e0cce7d37b065b5140349dbe12c6bcf6192fdd78
            paths: '["src"]'
            exclusions: '["third_party", "src/builtin_pb"]'
            cmake_args: '["-DSPM_BUILD_TEST=ON", "-DSPM_ENABLE_SHARED=OFF", "-DSPM_ENABLE_TCMALLOC=OFF"]'
          - name: mujoco
            repository: google-deepmind/mujoco
            revision: f640345f72b773e7ec52cd9426a57335cf9c6c28
            paths: '["src"]'
            exclusions: '[]'
            cmake_args: '["-DMUJOCO_BUILD_EXAMPLES=OFF", "-DMUJOCO_BUILD_SIMULATE=OFF", "-DMUJOCO_BUILD_TESTS=ON", "-DMUJOCO_TEST_PYTHON_UTIL=OFF"]'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: fixtures/${{ matrix.name }}
          persist-credentials: false
      - name: Prepare XGrammar configuration
        if: matrix.name == 'xgrammar'
        working-directory: fixtures/xgrammar
        run: |
          git submodule update --init --depth 1 3rdparty/dlpack 3rdparty/googletest
          printf '%s\n' 'set(XGRAMMAR_BUILD_PYTHON_BINDINGS OFF)' 'set(XGRAMMAR_BUILD_CXX_TESTS ON)' > config.cmake
      - name: Prepare MuJoCo test locale
        if: matrix.name == 'mujoco'
        run: sudo locale-gen de_DE.UTF-8
      - name: Validate and measure header changes
        uses: ./
        with:
          command: headers
          source: fixtures/${{ matrix.name }}
          forward-declarations: 'true'
          header-paths: ${{ matrix.paths }}
          exclude-paths: ${{ matrix.exclusions }}
          max-header-edits: '4'
          cmake-args: ${{ matrix.cmake_args }}
          runs: ${{ inputs.header_runs }}
          jobs: '2'
          artifact-name: ${{ matrix.name }}-header-cleanup

  unity-corpus:
    name: unity-corpus (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' && inputs.unity_corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sentencepiece
            repository: google/sentencepiece
            revision: e0cce7d37b065b5140349dbe12c6bcf6192fdd78
            target: sentencepiece-static
            exclusions: '["third_party", "src/builtin_pb"]'
            cmake_args: '["-DSPM_BUILD_TEST=ON", "-DSPM_ENABLE_SHARED=OFF", "-DSPM_ENABLE_TCMALLOC=OFF"]'
          - name: xgrammar
            repository: mlc-ai/xgrammar
            revision: 7e269d56c74c89de52bc8c31e42191155416371f
            target: xgrammar
            exclusions: '[]'
            cmake_args: '[]'
          - name: mujoco
            repository: google-deepmind/mujoco
            revision: f640345f72b773e7ec52cd9426a57335cf9c6c28
            target: mujoco
            exclusions: '[]'
            cmake_args: '["-DMUJOCO_BUILD_EXAMPLES=OFF", "-DMUJOCO_BUILD_SIMULATE=OFF", "-DMUJOCO_BUILD_TESTS=ON", "-DMUJOCO_TEST_PYTHON_UTIL=OFF"]'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: fixtures/${{ matrix.name }}
          persist-credentials: false
      - name: Prepare XGrammar C++ configuration
        if: matrix.name == 'xgrammar'
        working-directory: fixtures/xgrammar
        run: |
          git submodule update --init --depth 1 3rdparty/dlpack 3rdparty/googletest
          printf '%s\n' 'set(XGRAMMAR_BUILD_PYTHON_BINDINGS OFF)' 'set(XGRAMMAR_BUILD_CXX_TESTS ON)' > config.cmake
      - name: Prepare MuJoCo test locale
        if: matrix.name == 'mujoco'
        run: sudo locale-gen de_DE.UTF-8
      - name: Validate and measure a unity build
        uses: ./
        with:
          command: unity
          source: fixtures/${{ matrix.name }}
          unity-target: ${{ matrix.target }}
          unity-batch-size: '4'
          unity-exclude: ${{ matrix.exclusions }}
          cmake-args: ${{ matrix.cmake_args }}
          runs: ${{ inputs.unity_runs }}
          jobs: '2'
          artifact-name: ${{ matrix.name }}-unity
